        }
      } else if (lineDrag.active) {
        const l = lines.find(x => x.id === lineDrag.id);
        if (l) {
          const dx = pt.x - lineDrag.lastX, dy = pt.y - lineDrag.lastY;
          l.points.forEach(q => { q.x += dx; q.y += dy; });
        }
        lineDrag.lastX = pt.x; lineDrag.lastY = pt.y;
      } else if (dragging.active) {
        const shape = shapes.find(s => s.id === dragging.id);
        if (!shape) return;
        shape.x = pt.x - dragging.offsetX;
        shape.y = pt.y - dragging.offsetY;
      } else if (noteDrag.active) {
        const anchor = noteAnchor(noteDrag.obj);
        const desiredX = pt.x - noteDrag.grabX;
        const desiredY = pt.y - noteDrag.grabY;
        noteDrag.obj.noteOffsetX = desiredX - anchor.x;
        noteDrag.obj.noteOffsetY = desiredY - anchor.y;
      } else if (panning.active) {
        viewport.x = panning.originX + (evt.clientX - panning.startX);
        viewport.y = panning.originY + (evt.clientY - panning.startY);
      }
    }

    function onMouseUp(evt) {
      if (evt && evt.pointerType === 'touch') {
        touchPts.delete(evt.pointerId);
        if (pinch.active) {
          if (touchPts.size < 2) pinch.active = false;
          if (touchPts.size === 0) pointerIsDown = false;
          return;
        }
      }
      if (marquee.active) finishMarquee();
      commitDrawing();
      resizing.active = false;
      lineDrag.active = false; lineHandleDrag.active = false;
      dragging.active = false;
      dragging.id = null;
      noteDrag.active = false;
      noteDrag.obj = null;
      panning.active = false;
      pointerIsDown = false;
    }

    function onWheel(evt) {
      evt.preventDefault();
      const rect = svgEl.value.getBoundingClientRect();
      const cx = evt.clientX - rect.left;
      const cy = evt.clientY - rect.top;
      const factor = evt.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(2.5, Math.max(0.3, viewport.scale * factor));
      viewport.x = cx - ((cx - viewport.x) / viewport.scale) * newScale;
      viewport.y = cy - ((cy - viewport.y) / viewport.scale) * newScale;
      viewport.scale = newScale;
    }

    function zoomBy(factor) {
      const rect = svgEl.value.getBoundingClientRect();
      const cx = rect.width / 2, cy = rect.height / 2;
      const newScale = Math.min(2.5, Math.max(0.3, viewport.scale * factor));
      viewport.x = cx - ((cx - viewport.x) / viewport.scale) * newScale;
      viewport.y = cy - ((cy - viewport.y) / viewport.scale) * newScale;
      viewport.scale = newScale;
    }

    function resetView() { viewport.x = 0; viewport.y = 0; viewport.scale = 1; }

    function portPoint(shape, port) {
      const y = shape.y + shape.h / 2;
      const x = port === 'start' ? shape.x : shape.x + shape.w;
      return { x, y };
    }

    // Orthogonal (Manhattan) routing between two named ports. Every shape's boundary at
    // left-middle ('start') or right-middle ('end') is used as the anchor point — this lands
    // exactly on the boundary for rectangles, circles, and diamonds alike, so no per-shape-type
    // geometry is needed. Each end gets a short outward "stub" in its port's own direction.
    //
    // When the two stubs already face each other (e.g. end→start with the target to the
    // right), a simple 3-segment path between them is enough. But for same-side pairs
    // (start→start, end→end) — or any pairing where a stub's outward direction points away
    // from the other stub — a direct connector would double back through the source shape's
    // own body. In that case the path detours above or below both shapes instead.
    const PORT_STUB = 24;
    const DETOUR_CLEARANCE = 30;

    function connRoute(conn) {
      const from = shapes.find(s => s.id === conn.from);
      const to = shapes.find(s => s.id === conn.to);
      if (!from || !to) return null;
      const fromPort = conn.fromPort || 'end';
      const toPort = conn.toPort || 'start';

      const p1 = portPoint(from, fromPort);
      const p2 = portPoint(to, toPort);
      const dir1 = fromPort === 'start' ? -1 : 1;
      const dir2 = toPort === 'start' ? -1 : 1;
      const s1 = { x: p1.x + dir1 * PORT_STUB, y: p1.y };
      const s2 = { x: p2.x + dir2 * PORT_STUB, y: p2.y };

      // "Consistent" means the straight-line travel direction from s1 to s2 matches both
      // stubs' own outward-facing sense — i.e. continuing outward from s1 actually approaches
      // s2, AND s2 is approached from the correct side to enter p2 without backtracking. Any
      // same-side pair (start→start, end→end) fails this by construction — both stubs face the
      // same absolute direction, so no straight path can join them — and so does either
      // "facing-away" spatial arrangement. All of those need the detour.
      const travelDir = Math.sign(s2.x - s1.x);
      const consistent = travelDir !== 0 && travelDir === dir1 && travelDir === -dir2;

      if (consistent) {
        const midX = (s1.x + s2.x) / 2;
        return [p1, s1, { x: midX, y: s1.y }, { x: midX, y: s2.y }, s2, p2];
      }

      // Detour above or below both shapes, whichever is the shorter vertical travel. If more
      // than one connection between this same pair of shapes also detours on the same side,
      // stagger them so they don't all draw on top of each other.
      const topY = Math.min(from.y, to.y) - DETOUR_CLEARANCE;
      const bottomY = Math.max(from.y + from.h, to.y + to.h) + DETOUR_CLEARANCE;
      const avgY = (s1.y + s2.y) / 2;
      const useTop = Math.abs(avgY - topY) <= Math.abs(bottomY - avgY);

      const pairKey = [conn.from, conn.to].slice().sort().join('|');
      const detourSiblings = connections.filter(c => {
        if ([c.from, c.to].slice().sort().join('|') !== pairKey) return false;
        const cf = shapes.find(s => s.id === c.from), ct = shapes.find(s => s.id === c.to);
        if (!cf || !ct) return false;
        const cFromPort = c.fromPort || 'end', cToPort = c.toPort || 'start';
        const cp1 = portPoint(cf, cFromPort), cp2 = portPoint(ct, cToPort);
        const cdir1 = cFromPort === 'start' ? -1 : 1, cdir2 = cToPort === 'start' ? -1 : 1;
        const cs1 = { x: cp1.x + cdir1 * PORT_STUB, y: cp1.y }, cs2 = { x: cp2.x + cdir2 * PORT_STUB, y: cp2.y };
        const ctravel = Math.sign(cs2.x - cs1.x);
        const cConsistent = ctravel !== 0 && ctravel === cdir1 && ctravel === -cdir2;
        if (cConsistent) return false;
        const ctopY = Math.min(cf.y, ct.y) - DETOUR_CLEARANCE, cbottomY = Math.max(cf.y + cf.h, ct.y + ct.h) + DETOUR_CLEARANCE;
        const cavgY = (cs1.y + cs2.y) / 2;
        const cUseTop = Math.abs(cavgY - ctopY) <= Math.abs(cbottomY - cavgY);
        return cUseTop === useTop;
      });
      const myIdx = Math.max(0, detourSiblings.findIndex(c => c.id === conn.id));
      const stagger = myIdx * 14;
      const detourY = useTop ? topY - stagger : bottomY + stagger;
      return [p1, s1, { x: s1.x, y: detourY }, { x: s2.x, y: detourY }, s2, p2];
    }

    // Point-to-point mode: a direct line from the source shape's center toward the target
    // shape's center, clipped at each shape's own boundary so the line (and its arrowhead)
    // stay visible outside the shapes rather than passing through them. Works for rectangles,
    // circles, and diamonds alike.
    function boundaryPoint(shape, towardX, towardY) {
      const cx = shape.x + shape.w / 2;
      const cy = shape.y + shape.h / 2;
      const dx = towardX - cx;
      const dy = towardY - cy;
      if (dx === 0 && dy === 0) return { x: cx, y: cy };
      if (shape.type === 'circle') {
        const rx = shape.w / 2, ry = shape.h / 2;
        const angle = Math.atan2(dy / ry, dx / rx);
        return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
      }
      if (shape.type === 'diamond') {
        const hw = shape.w / 2, hh = shape.h / 2;
        const denom = (Math.abs(dx) / hw + Math.abs(dy) / hh) || 1e-6;
        const t = 1 / denom;
        return { x: cx + dx * t, y: cy + dy * t };
      }
      const hw = shape.w / 2, hh = shape.h / 2;
      const scaleX = hw / (Math.abs(dx) || 1e-6);
      const scaleY = hh / (Math.abs(dy) || 1e-6);
      const t = Math.min(scaleX, scaleY);
      return { x: cx + dx * t, y: cy + dy * t };
    }

    function connRoutePointToPoint(conn) {
      const from = shapes.find(s => s.id === conn.from);
      const to = shapes.find(s => s.id === conn.to);
      if (!from || !to) return null;
      const fromCenter = { x: from.x + from.w / 2, y: from.y + from.h / 2 };
      const toCenter = { x: to.x + to.w / 2, y: to.y + to.h / 2 };
      const p1 = boundaryPoint(from, toCenter.x, toCenter.y);
      const p2 = boundaryPoint(to, fromCenter.x, fromCenter.y);
      return [p1, p2];
    }

    function connPath(conn) {
      const pts = edgeStyle.value === 'point' ? connRoutePointToPoint(conn) : connRoute(conn);
      if (!pts) return '';
      return 'M ' + pts.map(p => p.x + ' ' + p.y).join(' L ');
    }

    function connMid(conn) {
      if (edgeStyle.value === 'point') {
        const pts = connRoutePointToPoint(conn);
        if (!pts) return { x: 0, y: 0 };
        return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      }
      const pts = connRoute(conn);
      if (!pts) return { x: 0, y: 0 };
      // midpoint of the connecting segment (the visual "middle" of the routed elbow)
      const a = pts[2], b = pts[3];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function diamondPoints(shape) {
      const w = shape.w, h = shape.h;
      return [[0, h / 2], [w / 2, 0], [w, h / 2], [w / 2, h]].map(p => p[0] + ',' + p[1]).join(' ');
    }

    function animateTo(targets, duration) {
      duration = duration || 420;
      const start = performance.now();
      const initial = shapes.map(s => ({ id: s.id, x: s.x, y: s.y }));
      function ease(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const e = ease(t);
        initial.forEach(init => {
          const target = targets.find(tg => tg.id === init.id);
          const shape = shapes.find(s => s.id === init.id);
          if (target && shape) {
            shape.x = init.x + (target.x - init.x) * e;
            shape.y = init.y + (target.y - init.y) * e;
          }
        });
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function autoArrange() {
      if (shapes.length === 0) return;
      const ids = shapes.map(s => s.id);
      const outAdj = new Map(ids.map(id => [id, []]));
      const inDeg = new Map(ids.map(id => [id, 0]));
      connections.forEach(c => {
        if (outAdj.has(c.from) && outAdj.has(c.to)) {
          outAdj.get(c.from).push(c.to);
          inDeg.set(c.to, inDeg.get(c.to) + 1);
        }
      });

      const layer = new Map(ids.map(id => [id, 0]));
      const inDegWork = new Map(inDeg);
      const queue = ids.filter(id => inDegWork.get(id) === 0);
      const processed = new Set();
      while (queue.length) {
        const u = queue.shift();
        processed.add(u);
        outAdj.get(u).forEach(v => {
          layer.set(v, Math.max(layer.get(v), layer.get(u) + 1));
          inDegWork.set(v, inDegWork.get(v) - 1);
          if (inDegWork.get(v) === 0) queue.push(v);
        });
      }
      const leftover = ids.filter(id => !processed.has(id));
      if (leftover.length) {
        const processedLayers = ids.filter(id => processed.has(id)).map(id => layer.get(id));
        const maxLayer = processedLayers.length ? Math.max.apply(null, processedLayers) : 0;
        leftover.forEach(id => layer.set(id, maxLayer + 1));
      }

      const layerGroups = new Map();
      ids.forEach(id => {
        const l = layer.get(id);
        if (!layerGroups.has(l)) layerGroups.set(l, []);
        layerGroups.get(l).push(id);
      });
      const layerKeys = Array.from(layerGroups.keys()).sort((a, b) => a - b);

      const orderIndex = new Map();
      layerKeys.forEach(l => layerGroups.get(l).forEach((id, i) => orderIndex.set(id, i)));

      const inAdj = new Map(ids.map(id => [id, []]));
      connections.forEach(c => { if (inAdj.has(c.to)) inAdj.get(c.to).push(c.from); });

      function reorderPass(useIn) {
        layerKeys.forEach(l => {
          const group = layerGroups.get(l);
          const scored = group.map(id => {
            const neighbors = useIn ? inAdj.get(id) : outAdj.get(id);
            if (!neighbors || neighbors.length === 0) return { id, score: orderIndex.get(id) };
            const avg = neighbors.reduce((sum, n) => sum + orderIndex.get(n), 0) / neighbors.length;
            return { id, score: avg };
          });
          scored.sort((a, b) => a.score - b.score);
          layerGroups.set(l, scored.map(s => s.id));
          scored.forEach((s, i) => orderIndex.set(s.id, i));
        });
      }
      reorderPass(true);
      reorderPass(false);
      reorderPass(true);

      const H_GAP = 90, V_GAP = 36, PAD_X = 60, PAD_Y = 60;
      const targets = [];
      let x = PAD_X;
      layerKeys.forEach(l => {
        const group = layerGroups.get(l);
        const colWidth = Math.max.apply(null, group.map(id => shapes.find(s => s.id === id).w));
        let y = PAD_Y;
        group.forEach(id => {
          const shape = shapes.find(s => s.id === id);
          targets.push({ id, x, y });
          y += shape.h + V_GAP;
        });
        x += colWidth + H_GAP;
      });

      animateTo(targets);
      resetView();
      clearSelection();
    }

    // Keeps only well-formed lines, so a damaged or older file cannot break rendering.
    function cleanLines(arr) {
      if (!Array.isArray(arr)) return [];
      return arr.filter(l => l && Array.isArray(l.points) && l.points.length >= 2 &&
        l.points.every(q => q && isFinite(q.x) && isFinite(q.y)))
        .map(l => ({
          id: l.id || ('line_' + Math.random().toString(36).slice(2, 8)),
          kind: l.kind === 'free' ? 'free' : 'line',
          points: l.points.map(q => ({ x: +q.x, y: +q.y })),
          stroke: l.stroke || '#14213D',
          width: +l.width > 0 ? +l.width : 3,
          arrow: l.kind === 'free' ? false : !!l.arrow,
          note: typeof l.note === 'string' ? l.note : '',
          noteOpen: !!l.noteOpen,
          noteOffsetX: isFinite(l.noteOffsetX) && l.noteOffsetX !== null ? +l.noteOffsetX : null,
          noteOffsetY: isFinite(l.noteOffsetY) && l.noteOffsetY !== null ? +l.noteOffsetY : null,
        }));
    }

    function getState() {
      return {
        shapes: JSON.parse(JSON.stringify(shapes)),
        connections: JSON.parse(JSON.stringify(connections)),
        lines: JSON.parse(JSON.stringify(lines)),
        edgeStyle: edgeStyle.value,
      };
    }

    function loadState(data) {
      data = data || {};
      shapes.splice.apply(shapes, [0, shapes.length].concat(data.shapes || []));
      connections.splice.apply(connections, [0, connections.length].concat(data.connections || []));
      lines.splice.apply(lines, [0, lines.length].concat(cleanLines(data.lines)));
      nextLineId = lines.reduce((m, l) => Math.max(m, (parseInt(String(l.id).split('_')[1], 10) || 0) + 1), 1);
      nextShapeId = shapes.reduce((m, s) => Math.max(m, (parseInt(String(s.id).split('_')[1], 10) || 0) + 1), 1);
      nextConnId = connections.reduce((m, c) => Math.max(m, (parseInt(String(c.id).split('_')[1], 10) || 0) + 1), 1);
      if (data.edgeStyle === 'elbow' || data.edgeStyle === 'point') edgeStyle.value = data.edgeStyle;
      clearSelection();
    }

    // ---- multiple files (tabs) ----
    // The live `shapes`/`connections`/`viewport` always belong to the active file. When the user
    // switches, the active file's data is copied into its record (`saved`) and the target's saved
    // copy is loaded in. `baseline` is the state when the file was opened or last exported, so a
    // file is "changed" when its current state differs from that baseline.
    const docs = reactive([]);
    const activeDocId = ref(null);
    let nextDocId = 1, untitledCount = 0;
    const activeDoc = computed(() => docs.find(d => d.id === activeDocId.value) || null);
    const closeConfirmName = computed(() => {
      const d = docs.find(x => x.id === closeConfirmDoc.value);
      return d ? d.name : '';
    });

    function untitledName() { untitledCount++; return untitledCount > 1 ? 'Untitled ' + untitledCount : 'Untitled'; }
    function stateKey(st) { return JSON.stringify({ shapes: st.shapes, connections: st.connections, lines: st.lines || [], edgeStyle: st.edgeStyle }); }
    function normalizeState(data) {
      data = data || {};
      return {
        shapes: Array.isArray(data.shapes) ? JSON.parse(JSON.stringify(data.shapes)) : [],
        connections: Array.isArray(data.connections) ? JSON.parse(JSON.stringify(data.connections)) : [],
        lines: cleanLines(JSON.parse(JSON.stringify(data.lines || []))),
        edgeStyle: (data.edgeStyle === 'elbow' || data.edgeStyle === 'point') ? data.edgeStyle : 'elbow',
      };
    }
    function currentSnapshot() {
      return { state: getState(), viewport: { x: viewport.x, y: viewport.y, scale: viewport.scale } };
    }
    function docDirty(d) {
      const st = d.id === activeDocId.value ? getState() : d.saved.state;
      return stateKey(st) !== d.baseline;
    }
    function resetTransient() {
      mode.value = 'select';
      connectFrom.value = null; connectFromPort.value = null;
      dragging.active = false; dragging.id = null;
      panning.active = false;
      noteDrag.active = false; noteDrag.obj = null;
      drawing.active = false; lineDrag.active = false; lineHandleDrag.active = false; resizing.active = false;
      textDialogTarget.value = null;
      exportDialog.value = null;
      showClearConfirm.value = false;
    }
    function applySnapshot(snap) {
      resetTransient();
      loadState(JSON.parse(JSON.stringify(snap.state)));
      viewport.x = snap.viewport.x; viewport.y = snap.viewport.y; viewport.scale = snap.viewport.scale;
    }
    function addDoc(data, name, fileName) {
      const st = normalizeState(data);
      const d = {
        id: 'doc_' + (nextDocId++), name: name, fileName: fileName || '',
        baseline: stateKey(st), saved: { state: st, viewport: { x: 0, y: 0, scale: 1 } },
      };
      docs.push(d);
      return d;
    }
    function switchDoc(id) {
      if (id === activeDocId.value) return;
      const d = docs.find(x => x.id === id);
      if (!d) return;
      const cur = activeDoc.value;
      if (cur) cur.saved = currentSnapshot();
      activeDocId.value = id;
      importedFileName.value = d.fileName;
      applySnapshot(d.saved);
    }
    function newDoc() {
      const d = addDoc({}, untitledName(), '');
      switchDoc(d.id);
      return d.id;
    }
    // Opens data as a file. An untouched "Untitled" file that is the only tab is reused,
    // so the first import does not leave an empty tab behind.
    function openDocument(data, fileName) {
      const cur = activeDoc.value;
      if (cur && docs.length === 1 && !cur.fileName && !docDirty(cur)) {
        const st = normalizeState(data);
        cur.fileName = fileName || '';
        cur.name = fileName || cur.name;
        cur.baseline = stateKey(st);
        cur.saved = { state: st, viewport: { x: 0, y: 0, scale: 1 } };
        importedFileName.value = cur.fileName;
        applySnapshot(cur.saved);
        return cur.id;
      }
      const d = addDoc(data, fileName || untitledName(), fileName || '');
      switchDoc(d.id);
      return d.id;
    }
    function closeDoc(id) {
      const idx = docs.findIndex(d => d.id === id);
      if (idx === -1) return;
      if (docs.length === 1) {
        docs.splice(0, 1);
        const d = addDoc({}, untitledName(), '');
        activeDocId.value = d.id;
        importedFileName.value = '';
        applySnapshot(d.saved);
        return;
      }
      const wasActive = id === activeDocId.value;
      docs.splice(idx, 1);
      if (wasActive) {
        const next = docs[Math.min(idx, docs.length - 1)];
        activeDocId.value = next.id;
        importedFileName.value = next.fileName;
        applySnapshot(next.saved);
      }
    }
    function requestCloseDoc(id) {
      const d = docs.find(x => x.id === id);
      if (!d) return;
      if (docDirty(d)) closeConfirmDoc.value = id; else closeDoc(id);
    }
    function closeDocConfirmYes() {
      const id = closeConfirmDoc.value;
      closeConfirmDoc.value = null;
      closeDoc(id);
    }
    function listDocuments() {
      return docs.map(d => ({ id: d.id, name: d.name, active: d.id === activeDocId.value, changed: docDirty(d) }));
    }

    // Base name proposed for exports: the imported file's name (minus extension), else "diagram".
    function defaultExportBase() {
      return importedFileName.value.replace(/\.[^.\\/]+$/, '') || 'diagram';
    }
    function cleanExportName(name, ext) {
      let n = String(name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').trim();
      n = n.replace(new RegExp('\\.' + ext + '$', 'i'), '').trim();
      return n || 'diagram';
    }
    function openExportDialog(kind) {
      if ((kind === 'pptx' || kind === 'png') && shapes.length === 0 && lines.length === 0) {
        alert('Add at least one shape or line before exporting to ' + (kind === 'png' ? 'PNG.' : 'PowerPoint.'));
        return;
      }
      exportDialog.value = { kind, name: defaultExportBase() };
    }
    function closeExportDialog() { exportDialog.value = null; }
    function confirmExport() {
      const d = exportDialog.value;
      if (!d) return;
      exportDialog.value = null;
      if (d.kind === 'pptx') exportPPTX(d.name);
      else if (d.kind === 'png') exportPNG(d.name);
      else exportJSON(d.name);
    }
    function onExportDialogKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); confirmExport(); }
      if (e.key === 'Escape') { e.preventDefault(); closeExportDialog(); }
      e.stopPropagation();
    }
    function onExportDialogInputMounted(vnode) {
      nextTick(() => { vnode.el.focus(); vnode.el.select(); });
    }

    function exportJSON(name) {
      const fileName = cleanExportName(typeof name === 'string' ? name : defaultExportBase(), 'json') + '.json';
      const data = getState();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
      URL.revokeObjectURL(url);
      const d = activeDoc.value;   // the file now has this name and counts as saved
      if (d) {
        d.name = fileName; d.fileName = fileName;
        d.baseline = stateKey(data);
        importedFileName.value = fileName;
      }
    }

    // ---- PowerPoint export ----
    // Every shape becomes a native PowerPoint autoshape (rect/ellipse/diamond) with its label
    // as centered text; every connection is redrawn as one or more straight PowerPoint line
    // segments following the same points our own SVG rendering uses (connRoute for elbow mode,
    // connRoutePointToPoint for point-to-point), so the exported deck matches what's on screen
    // in either mode. The whole diagram is scaled and centered to fit one slide. Notes aren't
    // included — they're canvas annotations, not part of the diagram itself.
    const PPTX_SHAPE_TYPE = { rectangle: 'rect', circle: 'ellipse', diamond: 'diamond' };
    const PPTX_SLIDE_W = 13.333, PPTX_SLIDE_H = 7.5, PPTX_MARGIN = 0.6;

    function pptxAddLineSegment(slide, pptx, p1, p2, isLast, style) {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      if (Math.abs(dx) < 0.005 && Math.abs(dy) < 0.005) return; // skip a zero-length segment
      const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
      const w = Math.abs(dx) || 0.01, h = Math.abs(dy) || 0.01;
      // A line shape's bounding box only has two possible diagonals; flip to the "/" one
      // when dx and dy have opposite signs (default is the "\" top-left-to-bottom-right one).
      const flipV = (dx * dy) < 0;
      slide.addShape(pptx.ShapeType.line, {
        x, y, w, h, flipV,
        line: {
          color: (style && style.color) || '1450AB',
          width: (style && style.width) || 1.25,
          // connections (no style) always end in an arrow; lines only when they have one
          endArrowType: (isLast && (!style || style.arrow)) ? 'triangle' : 'none',
        },
      });
    }

    async function exportPPTX(name) {
      if (typeof window.PptxGenJS === 'undefined') {
        alert('The PowerPoint export library failed to load.');
        return;
      }
      if (shapes.length === 0 && lines.length === 0) {
        alert('Add at least one shape or line before exporting to PowerPoint.');
        return;
      }
      const PptxGenJSCtor = window.PptxGenJS;
      const pptx = new PptxGenJSCtor();
      pptx.defineLayout({ name: 'DIAGRAM', width: PPTX_SLIDE_W, height: PPTX_SLIDE_H });
      pptx.layout = 'DIAGRAM';
      const slide = pptx.addSlide();

      // Bounding box across every shape and every connection's actual routed points (so
      // elbow detours and stubs that extend past shape edges aren't clipped off).
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      shapes.forEach(s => {
        minX = Math.min(minX, s.x); minY = Math.min(minY, s.y);
        maxX = Math.max(maxX, s.x + s.w); maxY = Math.max(maxY, s.y + s.h);
      });
      connections.forEach(c => {
        const pts = edgeStyle.value === 'point' ? connRoutePointToPoint(c) : connRoute(c);
        if (!pts) return;
        pts.forEach(p => {
          minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
        });
      });

      lines.forEach(l => {
        const pad = (l.width || 3) / 2;
        l.points.forEach(q => {
          minX = Math.min(minX, q.x - pad); minY = Math.min(minY, q.y - pad);
          maxX = Math.max(maxX, q.x + pad); maxY = Math.max(maxY, q.y + pad);
        });
      });

      const bboxW = Math.max(1, maxX - minX);
      const bboxH = Math.max(1, maxY - minY);
      const availW = PPTX_SLIDE_W - 2 * PPTX_MARGIN;
      const availH = PPTX_SLIDE_H - 2 * PPTX_MARGIN;
      const scale = Math.min(availW / bboxW, availH / bboxH);
      const offsetX = PPTX_MARGIN + (availW - bboxW * scale) / 2;
      const offsetY = PPTX_MARGIN + (availH - bboxH * scale) / 2;
      const toSlide = (x, y) => ({ x: offsetX + (x - minX) * scale, y: offsetY + (y - minY) * scale });

      shapes.forEach(s => {
        const pos = toSlide(s.x, s.y);
        slide.addText(s.label || '', {
          shape: pptx.ShapeType[PPTX_SHAPE_TYPE[s.type]] || pptx.ShapeType.rect,
          x: pos.x, y: pos.y, w: s.w * scale, h: s.h * scale,
          fill: { color: (s.fill || '#FFFFFF').replace('#', '') },
          line: { color: (s.stroke || '#14213D').replace('#', ''), width: 1.25 },
          rectRadius: s.type === 'rectangle' ? 0.08 : undefined,
          align: 'center', valign: 'middle', fontFace: 'Arial', fontSize: 12, color: '14213D',
          wrap: true,
        });
      });

      connections.forEach(c => {
        const rawPts = edgeStyle.value === 'point' ? connRoutePointToPoint(c) : connRoute(c);
        if (!rawPts) return;
        const pts = rawPts.map(p => toSlide(p.x, p.y));
        const cleaned = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const prev = cleaned[cleaned.length - 1];
          if (Math.abs(pts[i].x - prev.x) > 0.005 || Math.abs(pts[i].y - prev.y) > 0.005) cleaned.push(pts[i]);
        }
        const kind = connKindOf(c);
        const connStyle = { color: '1450AB', width: 1.25, arrow: kind === 'arrow' };
        for (let i = 0; i < cleaned.length - 1; i++) {
          pptxAddLineSegment(slide, pptx, cleaned[i], cleaned[i + 1], i === cleaned.length - 2, connStyle);
        }
        // crow's feet: two short toe lines at the target (and at the source for many-to-many)
        if (kind !== 'arrow' && cleaned.length >= 2) {
          const ends = [[cleaned[cleaned.length - 1], cleaned[cleaned.length - 2]]];
          if (kind === 'many-many') ends.push([cleaned[0], cleaned[1]]);
          ends.forEach(([tip, from]) => crowFootSegments(tip, from, CROW_LEN * scale, CROW_SPREAD * scale)
            .forEach(([a, b]) => pptxAddLineSegment(slide, pptx, a, b, false, connStyle)));
        }
        if (c.label) {
          const mid = toSlide(connMid(c).x, connMid(c).y);
          slide.addText(c.label, {
            x: mid.x - 0.75, y: mid.y - 0.16, w: 1.5, h: 0.32,
            align: 'center', valign: 'middle', fontFace: 'Arial', fontSize: 9, color: '4F5D75',
            fill: { color: 'F5F8FD' },
          });
        }
      });

      lines.forEach(l => {
        const pts = l.points.map(q => toSlide(q.x, q.y));
        const cleaned = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const prev = cleaned[cleaned.length - 1];
          if (Math.abs(pts[i].x - prev.x) > 0.005 || Math.abs(pts[i].y - prev.y) > 0.005) cleaned.push(pts[i]);
        }
        const style = { color: (l.stroke || '#14213D').replace('#', ''), width: Math.max(0.75, (l.width || 3) * scale * 72), arrow: !!l.arrow };
        for (let i = 0; i < cleaned.length - 1; i++) {
          pptxAddLineSegment(slide, pptx, cleaned[i], cleaned[i + 1], i === cleaned.length - 2, style);
        }
      });

      await pptx.writeFile({ fileName: cleanExportName(typeof name === 'string' ? name : defaultExportBase(), 'pptx') + '.pptx' });
    }

    // ---- PNG export ----
    // The picture is drawn straight from the data model onto a <canvas>, not from the live SVG.
    // (The SVG uses foreignObject labels, CSS variables and web fonts. A browser can taint or
    // blank the canvas when it rasterizes such an SVG.) The routes and arrow heads come from the
    // same helpers as the screen, so the PNG matches the canvas. Open notes are drawn with their
    // tether lines. Closed notes, ports, handles and selection marks are not drawn. The export does not change the file or its saved state.
    const PNG_PAD = 40, PNG_SCALE = 2, PNG_MAX_SIDE = 8000;
    const PNG_FONT = "'IBM Plex Sans', Arial, sans-serif";

    function pngWrapLines(ctx, text, maxW) {
      const out = [];
      String(text || '').split('\n').forEach(par => {
        const words = par.split(/\s+/).filter(Boolean);
        if (!words.length) { out.push(''); return; }
        let cur = '';
        words.forEach(w => {
          const t = cur ? cur + ' ' + w : w;
          if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = w; } else cur = t;
        });
        out.push(cur);
      });
      return out;
    }
    function pngPolyline(ctx, pts) {
      ctx.beginPath();
      pts.forEach((q, i) => { if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
      ctx.stroke();
    }
    function pngArrowHead(ctx, tip, from, size, color) {
      const dx = tip.x - from.x, dy = tip.y - from.y, len = Math.hypot(dx, dy);
      if (len < 0.5) return;
      const ux = dx / len, uy = dy / len, half = size * 0.42;
      const bx = tip.x - ux * size, by = tip.y - uy * size;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(bx - uy * half, by + ux * half);
      ctx.lineTo(bx + uy * half, by - ux * half);
      ctx.closePath();
      ctx.fill();
    }

    function pngRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
    }

    function exportPNG(name) {
      if (shapes.length === 0 && lines.length === 0) {
        alert('Add at least one shape or line before exporting to PNG.');
        return;
      }
      const fileName = cleanExportName(typeof name === 'string' ? name : defaultExportBase(), 'png') + '.png';
      const routes = connections.map(c => (edgeStyle.value === 'point' ? connRoutePointToPoint(c) : connRoute(c)));
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const grow = (x, y, pad) => {
        minX = Math.min(minX, x - pad); minY = Math.min(minY, y - pad);
        maxX = Math.max(maxX, x + pad); maxY = Math.max(maxY, y + pad);
      };
      shapes.forEach(s => { grow(s.x, s.y, 1); grow(s.x + s.w, s.y + s.h, 1); });
      routes.forEach(pts => { if (pts) pts.forEach(q => grow(q.x, q.y, 1)); });
      connections.forEach((c, i) => {
        if (c.label && routes[i]) { const m = connMid(c); grow(m.x - 60, m.y - 20, 0); grow(m.x + 60, m.y + 4, 0); }
      });
      lines.forEach(l => { const pad = (l.width || 3) / 2 + 1; l.points.forEach(q => grow(q.x, q.y, pad)); });
      // open notes: the card and its tether line are part of the picture
      const openNotes = [];
      shapes.forEach(o => { if (o.noteOpen) openNotes.push({ o, title: 'Note \u2014 ' + (o.label || '') }); });
      connections.forEach(o => { if (o.noteOpen) openNotes.push({ o, title: 'Note \u2014 connection' }); });
      lines.forEach(o => { if (o.noteOpen) openNotes.push({ o, title: 'Note \u2014 ' + (o.kind === 'free' ? 'drawing' : 'line') }); });
      openNotes.forEach(n => {
        n.anchor = noteAnchor(n.o); n.pos = notePos(n.o);
        grow(n.anchor.x, n.anchor.y, 1);
        grow(n.pos.x, n.pos.y, 1); grow(n.pos.x + NOTE_W, n.pos.y + NOTE_H, 1);
      });
      const worldW = Math.max(1, maxX - minX) + 2 * PNG_PAD;
      const worldH = Math.max(1, maxY - minY) + 2 * PNG_PAD;
      const k = Math.min(PNG_SCALE, PNG_MAX_SIDE / worldW, PNG_MAX_SIDE / worldH);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(worldW * k));
      canvas.height = Math.max(1, Math.round(worldH * k));
      const ctx = canvas.getContext('2d');
      if (!ctx) { alert('The PNG export failed: the browser has no canvas support.'); return; }
      ctx.fillStyle = '#F5F8FD';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(k, 0, 0, k, (PNG_PAD - minX) * k, (PNG_PAD - minY) * k);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';

      // connections: routed polyline, arrow head at the end, optional label
      connections.forEach((c, i) => {
        const pts = routes[i];
        if (!pts || pts.length < 2) return;
        const col = '#1450AB';
        const last = pts[pts.length - 1];
        let prev = pts[pts.length - 2];
        for (let j = pts.length - 2; j >= 0; j--) { prev = pts[j]; if (Math.hypot(last.x - prev.x, last.y - prev.y) > 0.5) break; }
        const kind = connKindOf(c);
        ctx.strokeStyle = col; ctx.lineWidth = 1.8;
        if (kind === 'arrow') {
          const len = Math.hypot(last.x - prev.x, last.y - prev.y);
          const size = Math.min(8 * 1.8, len);
          const ux = len ? (last.x - prev.x) / len : 0, uy = len ? (last.y - prev.y) / len : 0;
          const body = pts.slice(0, -1).concat([{ x: last.x - ux * size * 0.8, y: last.y - uy * size * 0.8 }]);
          pngPolyline(ctx, body);
          pngArrowHead(ctx, last, prev, size, col);
        } else {
          pngPolyline(ctx, pts);
          const feet = crowFootSegments(last, prev);
          if (kind === 'many-many') feet.push.apply(feet, crowFootSegments(pts[0], distinctNeighbor(pts, 0, 1)));
          feet.forEach(([a, b]) => pngPolyline(ctx, [a, b]));
        }
        if (c.label) {
          const m = connMid(c);
          ctx.font = '500 11px ' + PNG_FONT;
          ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.lineWidth = 4; ctx.strokeStyle = '#F5F8FD';
          ctx.strokeText(c.label, m.x, m.y - 8);
          ctx.fillStyle = '#4F5D75';
          ctx.fillText(c.label, m.x, m.y - 8);
        }
      });

      // shapes: fill, outline, centered wrapped label
      shapes.forEach(s => {
        ctx.fillStyle = s.fill || '#FFFFFF';
        ctx.strokeStyle = s.stroke || '#14213D';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (s.type === 'circle') {
          ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, Math.PI * 2);
        } else if (s.type === 'diamond') {
          ctx.moveTo(s.x + s.w / 2, s.y); ctx.lineTo(s.x + s.w, s.y + s.h / 2);
          ctx.lineTo(s.x + s.w / 2, s.y + s.h); ctx.lineTo(s.x, s.y + s.h / 2); ctx.closePath();
        } else {
          const r = Math.min(10, s.w / 2, s.h / 2);
          ctx.moveTo(s.x + r, s.y); ctx.lineTo(s.x + s.w - r, s.y); ctx.arcTo(s.x + s.w, s.y, s.x + s.w, s.y + r, r);
          ctx.lineTo(s.x + s.w, s.y + s.h - r); ctx.arcTo(s.x + s.w, s.y + s.h, s.x + s.w - r, s.y + s.h, r);
          ctx.lineTo(s.x + r, s.y + s.h); ctx.arcTo(s.x, s.y + s.h, s.x, s.y + s.h - r, r);
          ctx.lineTo(s.x, s.y + r); ctx.arcTo(s.x, s.y, s.x + r, s.y, r); ctx.closePath();
        }
        ctx.fill(); ctx.stroke();
        if (s.label) {
          ctx.font = '500 13px ' + PNG_FONT;
          ctx.fillStyle = '#14213D'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const inner = s.type === 'diamond' ? s.w * 0.5 : (s.type === 'circle' ? s.w * 0.7 : s.w) - 20;
          const rows = pngWrapLines(ctx, s.label, Math.max(20, inner));
          const lh = 13 * 1.25, top = s.y + s.h / 2 - (rows.length - 1) * lh / 2;
          rows.forEach((row, n) => ctx.fillText(row, s.x + s.w / 2, top + n * lh));
        }
      });

      // lines: straight (with arrow head) and freehand (smoothed like linePath)
      lines.forEach(l => {
        const p = l.points;
        if (!p || p.length < 2) return;
        const col = l.stroke || '#14213D';
        ctx.strokeStyle = col; ctx.lineWidth = l.width || 3;
        ctx.beginPath();
        ctx.moveTo(p[0].x, p[0].y);
        if (l.kind === 'free' && p.length >= 3) {
          for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i].x, p[i].y, (p[i].x + p[i + 1].x) / 2, (p[i].y + p[i + 1].y) / 2);
          ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
          ctx.stroke();
        } else {
          const g = arrowGeom(l);
          const end = g ? { x: (g.base.x + g.tip.x) / 2, y: (g.base.y + g.tip.y) / 2 } : p[p.length - 1];
          ctx.lineTo(end.x, end.y);
          ctx.stroke();
          if (g) {
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(g.tip.x, g.tip.y); ctx.lineTo(g.left.x, g.left.y); ctx.lineTo(g.right.x, g.right.y);
            ctx.closePath(); ctx.fill();
          }
        }
      });

      // open notes: dotted tether, then the card (header and text), drawn on top
      openNotes.forEach(n => {
        const x = n.pos.x, y = n.pos.y;
        ctx.save();
        ctx.strokeStyle = '#4F5D75'; ctx.lineWidth = 1.3; ctx.setLineDash([4, 4]); ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(n.anchor.x, n.anchor.y); ctx.lineTo(x, y + NOTE_H / 2); ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.shadowColor = 'rgba(20,30,25,0.16)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
        ctx.fillStyle = '#FFFFFF';
        pngRoundRect(ctx, x, y, NOTE_W, NOTE_H, 10); ctx.fill();
        ctx.restore();
        ctx.strokeStyle = '#DCE4F0'; ctx.lineWidth = 1;
        pngRoundRect(ctx, x, y, NOTE_W, NOTE_H, 10); ctx.stroke();
        ctx.save();
        pngRoundRect(ctx, x, y, NOTE_W, NOTE_H, 10); ctx.clip();
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.font = '600 11.5px ' + PNG_FONT; ctx.fillStyle = '#4F5D75';
        let title = n.title;
        while (title.length > 1 && ctx.measureText(title).width > NOTE_W - 20) title = title.slice(0, -2) + '\u2026';
        ctx.fillText(title, x + 9, y + 21);
        const bx = x + 9, by = y + 32, bw = NOTE_W - 18, bh = NOTE_H - 41;
        ctx.fillStyle = '#FCFDFC'; pngRoundRect(ctx, bx, by, bw, bh, 7); ctx.fill();
        ctx.strokeStyle = '#DCE4F0'; pngRoundRect(ctx, bx, by, bw, bh, 7); ctx.stroke();
        ctx.beginPath(); ctx.rect(bx + 2, by + 2, bw - 4, bh - 4); ctx.clip();
        ctx.font = '400 12.5px ' + PNG_FONT;
        const text = String(n.o.note || '');
        ctx.fillStyle = text ? '#14213D' : '#8A939B';
        pngWrapLines(ctx, text || 'Add a note\u2026', bw - 16).forEach((row, i) => ctx.fillText(row, bx + 8, by + 18 + i * 16));
        ctx.restore();
      });

      canvas.toBlob(blob => {
        if (!blob) { alert('The PNG export failed.'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    }

    function triggerImport() {
      if (fileInput.value) fileInput.value.click();
    }

    async function importJSON(evt) {
      const files = Array.from(evt.target.files || []);
      evt.target.value = '';
      if (!files.length) return;
      const loaded = [], failed = [];
      for (const f of files) {
        try {
          const data = JSON.parse(await f.text());
          if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('not a diagram');
          loaded.push({ data, name: f.name });
        } catch (err) { failed.push(f.name); }
      }
      // The first file opens and becomes the active tab. The others open in the background.
      loaded.forEach((l, i) => { if (i === 0) openDocument(l.data, l.name); else addDoc(l.data, l.name, l.name); });
      if (failed.length) alert('Could not read: ' + failed.join(', ') + '. Make sure each one is a diagram JSON export.');
    }

    function deleteSelected() {
      if (multiCount.value > 0) deleteMulti();
      else if (selectedShapeId.value) removeShape(selectedShapeId.value);
      else if (selectedConnId.value) removeConnection(selectedConnId.value);
      else if (selectedLineId.value) removeLine(selectedLineId.value);
    }

    function onKeydown(e) {
      const tag = e.target && e.target.tagName;
      if (showClearConfirm.value) {
        if (e.key === 'Escape') showClearConfirm.value = false;
        return;
      }
      if (closeConfirmDoc.value) {
        if (e.key === 'Escape') closeConfirmDoc.value = null;
        return;
      }
      if (exportDialog.value) {
        if (e.key === 'Escape') closeExportDialog();
        return;
      }
      if (textDialogTarget.value) {
        if (e.key === 'Escape') closeTextDialog();
        return;
      }
      if (connectMenuOpen.value) {
        if (e.key === 'Escape') connectMenuOpen.value = false;
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        deleteSelected();
      }
      if (e.key === 'Escape') {
        multiMode.value = false;
        drawing.active = false;
        connectFrom.value = null;
        connectFromPort.value = null;
        mode.value = 'select';
        clearSelection();
        showClearConfirm.value = false;
      }
    }

    function toggleConnectMode() {
      connectMenuOpen.value = false;
      mode.value = mode.value === 'connect' ? 'select' : 'connect';
      connectFrom.value = null;
      connectFromPort.value = null;
    }

    // Connect button: while connecting it stops; otherwise it lists the connection types.
    function onConnectButton() {
      if (mode.value === 'connect') { toggleConnectMode(); return; }
      connectMenuOpen.value = !connectMenuOpen.value;
    }
    function startConnect(kind) {
      multiMode.value = false;
      connKind.value = (kind === 'one-many' || kind === 'many-many') ? kind : 'arrow';
      connectMenuOpen.value = false;
      mode.value = 'connect';
      connectFrom.value = null;
      connectFromPort.value = null;
    }

    onMounted(() => {
      window.addEventListener('keydown', onKeydown);
      if (systemDark && systemDark.addEventListener) systemDark.addEventListener('change', onSystemTheme);
      document.addEventListener('scroll', keepFrameInPlace, true);

      const a = addShape('rectangle', { x: 80, y: 80, label: 'Start' });
      const b = addShape('rectangle', { x: 320, y: 40, label: 'Fetch data' });
      const c = addShape('diamond', { x: 320, y: 220, label: 'Valid?' });
      const d = addShape('rectangle', { x: 580, y: 40, label: 'Process' });
      const e2 = addShape('circle', { x: 580, y: 240, label: 'Error' });
      addConnection(a, b);
      addConnection(a, c);
      addConnection(b, d);
      addConnection(c, e2);
      clearSelection();
      const first = addDoc(getState(), untitledName(), '');
      activeDocId.value = first.id;

      window.DiagramAPI = {
        addLine: (x1, y1, x2, y2, opts) => addLine('line', [{ x: x1, y: y1 }, { x: x2, y: y2 }], opts),
        addFreehand: (points, opts) => addLine('free', simplifyPoints(points, 0.01), opts),

        setConnectionKind: (id, kind) => { const c = connections.find(x => x.id === id); if (c) c.kind = connKindOf({ kind }); return !!c; },

        selectShape, selectConnection, clearSelection, selectMany, deleteSelected,
        setEdgeStyle: (style) => { if (style === 'elbow' || style === 'point') edgeStyle.value = style; },
      };
    });
    // The page and the app frame never scroll; only the panel, tab bar and dialogs do. A focused
    // element or the browser itself can still scroll them on a phone, which pushes the header off
    // screen with no way back. This puts them back at once.
    function keepFrameInPlace(e) {
      const el = e.target === document ? document.scrollingElement : e.target;
      if (!el) return;
      const frame = el === document.scrollingElement || el === document.body || el.id === 'app' ||
        (el.classList && (el.classList.contains('app-shell') || el.classList.contains('workspace') || el.classList.contains('canvas-wrap')));
      if (frame && (el.scrollTop || el.scrollLeft)) { el.scrollTop = 0; el.scrollLeft = 0; }
    }

    onBeforeUnmount(() => {
      document.removeEventListener('scroll', keepFrameInPlace, true);
      window.removeEventListener('keydown', onKeydown);
      if (systemDark && systemDark.removeEventListener) systemDark.removeEventListener('change', onSystemTheme);
    });

    const viewportTransform = computed(() => 'translate(' + viewport.x + ' ' + viewport.y + ') scale(' + viewport.scale + ')');

    return {
      shapes, connections, mode, edgeStyle, connectFrom, connectFromPort, connectFromShape, selectedShapeId, selectedConnId,
