<script>
  // Theme: the saved choice, else the system setting. Set before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('discussion-studio-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#4F5D75;
    --paper:#F5F8FD;
    --panel:#FFFFFF;
    --border:#DCE4F0;
    /* blue: selection and focus, orange: active tool and main action, green: success */
    --accent:#1D6CE0;
    --accent-dark:#1450AB;
    --accent-soft:#E4EEFD;
    --hl:#F57C1F;
    --hl-dark:#C75A06;
    --hl-soft:#FFF0E2;
    --green:#18A36B;
    --green-soft:#E0F6EB;
    --warn:#D93A2B;
    --warn-soft:#FCE4E1;
    --grid-dot:#D3DCEA;
    --conn:#1450AB;
    --shape-ink:#14213D;
    --field-bg:#FCFDFC;
    --tabbar-bg:#EAF1FC;
    --tab-bg:#D9E5F8;
    --tab-hover:#E1EBFA;
    --menu-hover:#EAF1FC;
    --menu-current:#FFF1E6;
    --topbar-a:#1450AB;
    --topbar-b:#1D6CE0;
    --scrim:rgba(20,33,61,.45);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  /* dark theme: same roles, darker ground. Shapes keep their own light fills, like cards. */
  :root[data-theme="dark"]{
    --ink:#E6ECF7;
    --ink-soft:#9DABC2;
    --paper:#0E1525;
    --panel:#172134;
    --border:#2B3853;
    --accent:#5B9BFF;
    --accent-dark:#9CC2FF;
    --accent-soft:#1D2C49;
    --hl:#F57C1F;
    --hl-dark:#FF9B4D;
    --hl-soft:#3B2615;
    --green:#2BC184;
    --green-soft:#11301F;
    --warn:#F06B5E;
    --warn-soft:#3A1D1B;
    --grid-dot:#25314A;
    --conn:#7FB0FF;
    --field-bg:#111A2C;
    --tabbar-bg:#0B1220;
    --tab-bg:#162036;
    --tab-hover:#1D2942;
    --menu-hover:#22304B;
    --menu-current:#3B2615;
    --topbar-a:#0F1E3D;
    --topbar-b:#1A3770;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  /* phones: pinch-zoom and double-tap zoom of the page are off everywhere (the canvas zooms itself),
     but the panel and the tab bar can still scroll */
  html{touch-action:pan-x pan-y;}
  body{position:fixed;inset:0;}
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    color:var(--ink);
    background:var(--paper);
    overflow:hidden;
  }
  #app{position:fixed;inset:0;}   /* not 100vh: on phones that is taller than the visible screen */
  .app-shell{display:flex;flex-direction:column;height:100%;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;
    background:linear-gradient(90deg, var(--topbar-a), var(--topbar-b));color:#FFFFFF;
    padding:10px 16px;
    flex-shrink:0;
    border-bottom:1px solid #0000;
    z-index:5;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;font-size:16px;letter-spacing:0.2px;
    white-space:nowrap;padding-right:14px;
    border-right:1px solid rgba(255,255,255,.28);
    display:flex;align-items:center;gap:9px;
    color:inherit;text-decoration:none;
  }
  .brand:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px;border-radius:4px;}
  .brand-logo{flex-shrink:0;display:block;}
  .app-tagline{align-self:flex-end;margin:0 0 4px -3px;font-family:'IBM Plex Sans', sans-serif;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.78);letter-spacing:.02em;}
  .tabbar{
    display:flex;align-items:flex-end;gap:2px;flex-shrink:0;overflow-x:auto;
    background:var(--tabbar-bg);border-bottom:1px solid var(--border);padding:6px 12px 0;
  }
  .tab{
    display:flex;align-items:center;gap:7px;max-width:230px;flex-shrink:0;
    padding:6px 6px 6px 12px;font-size:12.5px;color:var(--ink-soft);
    background:var(--tab-bg);border:1px solid var(--border);border-bottom:none;
    border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap;user-select:none;
  }
  .tab:hover{background:var(--tab-hover);}
  .tab.active{background:var(--paper);color:var(--accent-dark);font-weight:600;box-shadow:inset 0 3px 0 var(--hl);margin-bottom:-1px;padding-bottom:7px;}
  .tab-name{overflow:hidden;text-overflow:ellipsis;}
  .tab-dirty{width:7px;height:7px;border-radius:50%;background:var(--hl);flex-shrink:0;}
  .tab-close{
    border:none;background:none;color:inherit;font-size:15px;line-height:1;
    width:18px;height:18px;border-radius:4px;cursor:pointer;padding:0;flex-shrink:0;
  }
  .tab-close:hover{background:rgba(128,128,128,.22);}
  .tab-new{border:none;background:none;font-size:18px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 10px 6px;flex-shrink:0;}
  .tab-new:hover{color:var(--ink);}
  .export-ext{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .export-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  .export-row .text-dialog-input{margin:0;flex:1;min-width:0;}
  .toolgroup{display:flex;align-items:center;gap:4px;}
  .topbar > *{flex-shrink:0;}
  .divider{width:1px;height:22px;background:rgba(255,255,255,.28);margin:0 4px;}
  .spacer{flex:1;}

  .tbtn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid transparent;
    color:#FFFFFF;
    padding:7px 10px;border-radius:8px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
    cursor:pointer;transition:background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .tbtn svg{flex-shrink:0;}
  .tbtn:hover{background:rgba(255,255,255,.16);}
  .tbtn.active{background:var(--hl);border-color:var(--hl);color:#fff;box-shadow:0 4px 12px -4px rgba(199,90,6,.6);}
  .tbtn.danger:hover{background:var(--warn);border-color:var(--warn);}
  .tbtn:disabled{opacity:.35;cursor:not-allowed;}
  .tbtn:disabled:hover{background:transparent;}
  .icon-only{padding:7px 8px;}

  .edge-style-toggle{display:flex;border:1px solid rgba(255,255,255,.32);border-radius:8px;overflow:hidden;}
  .edge-style-toggle button{
    display:flex;align-items:center;justify-content:center;
    padding:6px 9px;border:none;background:transparent;color:#CFE0FB;cursor:pointer;
  }
  .edge-style-toggle button+button{border-left:1px solid rgba(255,255,255,.32);}
  .edge-style-toggle button:hover{background:rgba(255,255,255,.16);color:#FFFFFF;}
  .edge-style-toggle button.active{background:var(--hl);color:#fff;}

  .connect-wrap{position:relative;}
  .tbtn .caret{margin-left:2px;opacity:.8;font-size:10px;}
  .menu-backdrop{position:fixed;inset:0;z-index:20;}
  .connect-menu{
    position:absolute;top:calc(100% + 6px);left:0;z-index:21;min-width:275px;
    background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 12px 30px -10px rgba(20,33,61,.35);padding:6px;animation:pop .15s ease;
  }
  .connect-menu button{
    display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:none;border-radius:7px;
    background:transparent;color:var(--ink);text-align:left;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
  }
  .connect-menu button:hover, .connect-menu button:focus-visible{background:var(--menu-hover);outline:none;}
  .connect-menu button.current{background:var(--menu-current);}
  .connect-menu .kind-icon{flex-shrink:0;color:var(--conn);display:block;}
  .connect-menu .kind-text{display:flex;flex-direction:column;line-height:1.3;}
  .connect-menu .kind-name{font-size:13px;font-weight:600;}
  .connect-menu .kind-desc{font-size:11.5px;color:var(--ink-soft);}
  .port-toggle.kind-toggle button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);}
  .port-toggle.kind-toggle button svg{display:block;}
  .hint-chip{
    font-size:12px;color:#FFFFFF;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
    padding:4px 9px;border-radius:20px;
    animation:pop .15s ease;white-space:nowrap;
  }
  @keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}

  /* ---------- workspace ---------- */
  .workspace{flex:1;display:flex;min-height:0;position:relative;}
  /* touch: the canvas handles its own drags and pinches, so the browser must not scroll or zoom it */
  svg.board{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  body{-webkit-tap-highlight-color:transparent;}
  button{touch-action:manipulation;}
  .touch-hit{fill:transparent !important;stroke:none !important;display:none;}
  .resize-handle, .line-handle{transform-box:fill-box;transform-origin:center;}
  .canvas-hint.connect-hint{display:none;}   /* wide screens show the chip in the toolbar */
  @media (pointer: coarse){
    .field input[type=text], .field input[type=number], .panel-note, .text-dialog-input, .note-box textarea{font-size:16px;}
    .touch-hit{display:inline;}                      /* bigger invisible target round each small icon */
    .resize-handle{transform:scale(1.9);}
    .line-handle{transform:scale(1.7);}
    .conn-hit{stroke-width:26;}
    .line-hit{stroke-width:24;}
    .zoom-hud button{min-width:40px;min-height:40px;}
    .tbtn.icon-only{padding:9px 10px;}
  }
  /* narrow screens: the panel slides over the canvas instead of squeezing it */
  @media (max-width: 760px){
    .tlabel{display:none;}                         /* icon-only toolbar */
    .tbtn{padding:8px 9px;}
    .tbtn .caret{margin-left:0;}
    .brand{padding-right:8px;}
    .topbar .hint-chip{display:none;}
    .canvas-hint.multi-hint, .canvas-hint.connect-hint{display:block;left:12px;right:12px;bottom:70px;max-width:none;text-align:center;}
    .panel{position:absolute;top:0;right:0;bottom:0;z-index:8;width:min(300px, 88vw) !important;box-shadow:-12px 0 30px -12px rgba(0,0,0,.35);}
    .app-tagline{display:none;}
    .canvas-hint{display:none;}
    .topbar{padding:8px 10px;gap:6px;}
  }
  .canvas-wrap{flex:1;position:relative;min-width:0;}
  svg.board{width:100%;height:100%;display:block;cursor:grab;}
  svg.board.mode-connect, svg.board.mode-draw{cursor:crosshair;}
  .resize-handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;}
  .resize-handle:hover{fill:var(--accent-soft);}
  .line-hit{fill:none;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;pointer-events:stroke;}
  .line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .line-halo{fill:none;stroke:var(--accent);opacity:.25;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .line-handle{fill:var(--panel);stroke:var(--accent);stroke-width:2;cursor:move;}
  .field .check-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;margin:0;}
  .check-row input{margin:0;}
  svg.board:active{cursor:grabbing;}

  .shape-group{cursor:move;}
  .shape-group.connect-source > *{filter:drop-shadow(0 0 0 2px var(--green));}
  .shape-label{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:6px 10px;
    font-size:13px;font-weight:500;color:var(--shape-ink);
    line-height:1.25;pointer-events:none;user-select:none;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .conn-path{fill:none;stroke:var(--conn);stroke-width:2;}
  .conn-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;}
  .conn-group.selected .conn-path{stroke:var(--hl);stroke-width:2.5;}
  .conn-group.multi .conn-path{stroke:var(--hl);stroke-width:2.5;}
  .shape-group.multi > rect, .shape-group.multi > ellipse, .shape-group.multi > polygon{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 3;}
  .marquee{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3;pointer-events:none;}
  .conn-label{
    font-size:11px;fill:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;
    text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;
  }
  .ghost-line{stroke:var(--green);stroke-width:2;stroke-dasharray:6 5;pointer-events:none;}
  .add-label-hint{cursor:pointer;}
  .add-label-hint circle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;}
  .add-label-hint text{fill:var(--accent);font-size:13px;font-weight:600;text-anchor:middle;font-family:'IBM Plex Sans',sans-serif;pointer-events:none;}
  .add-label-hint:hover circle{fill:var(--accent-soft);}

  .note-icon{cursor:pointer;}
  .note-icon circle{fill:var(--panel);stroke:var(--ink-soft);stroke-width:1.3;}
  .note-icon line{stroke:var(--ink-soft);stroke-width:1.3;stroke-linecap:round;}
  .note-icon:hover circle{stroke:var(--accent);}
  .note-icon:hover line{stroke:var(--accent);}
  .note-icon.has-note circle{fill:var(--hl);stroke:var(--hl);}
  .note-icon.has-note line{stroke:#fff;}
  .note-icon.active circle{stroke:var(--ink);stroke-width:2;}
  .note-icon.has-note.active circle{fill:var(--hl);stroke:var(--ink);}

  .connect-icon{cursor:crosshair;}
  .connect-icon circle{fill:var(--panel);stroke:var(--ink-soft);stroke-width:1.3;}
  .connect-icon line, .connect-icon polyline{stroke:var(--ink-soft);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .connect-icon:hover circle{stroke:var(--accent);}
  .connect-icon:hover line, .connect-icon:hover polyline{stroke:var(--accent);}
  .connect-icon.active circle{fill:var(--green);stroke:var(--green);}
  .connect-icon.active line, .connect-icon.active polyline{stroke:#fff;}

  .note-tether{stroke:var(--ink-soft);stroke-width:1.3;stroke-dasharray:4 4;fill:none;pointer-events:none;}

  .note-box{
    width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    border-top:3px solid var(--hl);box-shadow:0 8px 22px rgba(20,80,171,.16);padding:8px 9px;
  }
  .note-box-header{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
    font-family:'IBM Plex Sans',sans-serif;cursor:move;user-select:none;
  }
  .note-box-header span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;}
  .note-box-header button{
    background:none;border:none;cursor:pointer;font-size:16px;line-height:1;
    color:var(--ink-soft);padding:0 2px;flex-shrink:0;
  }
  .note-box-header button:hover{color:var(--warn);}
  .note-box textarea{
    flex:1;width:100%;resize:none;box-sizing:border-box;
    border:1px solid var(--border);border-radius:7px;padding:7px 8px;
    font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:var(--ink);
    outline:none;background:var(--field-bg);
  }
  .note-box textarea:focus{border-color:var(--accent);}

  .zoom-hud{
    position:absolute;bottom:14px;left:14px;
    display:flex;align-items:center;gap:2px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:4px;box-shadow:0 4px 12px rgba(20,80,171,.12);
  }
  .zoom-hud button{
    width:28px;height:28px;border:none;background:transparent;border-radius:6px;
    cursor:pointer;color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;
  }
  .zoom-hud button:hover{background:var(--accent-soft);color:var(--accent-dark);}
  .zoom-pct{font-size:12px;color:var(--ink-soft);width:42px;text-align:center;font-variant-numeric:tabular-nums;}

  .canvas-hint{
    position:absolute;bottom:14px;right:14px;
    font-size:12px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--border);
    padding:6px 12px;border-radius:20px;
    box-shadow:0 4px 12px rgba(20,80,171,.10);
    max-width:420px;
  }

  /* ---------- properties panel ---------- */
  .panel{
    width:268px;flex-shrink:0;background:var(--panel);
    border-left:1px solid var(--border);border-top:3px solid var(--green);
    padding:18px 16px;overflow-y:auto;
  }
  .panel h3{
    margin:0 0 14px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
    text-transform:none;color:var(--accent-dark);
  }
  .empty-panel{color:var(--ink-soft);font-size:13px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field input[type=text]{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--field-bg);
  }
  .field input[type=text]:focus{outline:none;border-color:var(--accent);}
  .field input[type=number]{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--field-bg);
  }
  .field input[type=number]:focus{outline:none;border-color:var(--accent);}
  .panel-note{
    width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--field-bg);
    resize:vertical;box-sizing:border-box;
  }
  .panel-note:focus{outline:none;border-color:var(--accent);}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;}
  .swatch{
    width:26px;height:26px;border-radius:7px;cursor:pointer;
    border:2px solid rgba(0,0,0,.08);
  }
  .swatch.selected{border-color:var(--ink);}
  .row2{display:flex;gap:8px;}
  .row2 .field{flex:1;min-width:0;}
  .port-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .port-toggle button{
    flex:1;padding:7px 4px;border:none;background:var(--field-bg);color:var(--ink-soft);
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;
  }
  .port-toggle button+button{border-left:1px solid var(--border);}
  .port-toggle button.active{background:var(--accent);color:#fff;}
  .port-toggle button:hover:not(.active){background:var(--accent-soft);}
  .delete-btn{
    width:100%;margin-top:6px;padding:9px;border-radius:8px;border:1px solid var(--warn-soft);
    background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px;cursor:pointer;
  }
  .delete-btn:hover{background:var(--warn);color:#fff;border-color:var(--warn);}
  .meta-row{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .api-doc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .api-doc code{
    display:block;background:var(--paper);border:1px solid var(--border);border-radius:7px;
    padding:9px 10px;margin:5px 0 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    color:var(--ink);white-space:pre-wrap;word-break:break-word;
  }

  .modal-overlay{
    position:fixed;inset:0;background:var(--scrim);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal-box{
    width:340px;max-width:90vw;background:var(--panel);border-radius:12px;
    padding:22px 22px 18px;border-top:4px solid var(--accent);box-shadow:0 16px 40px rgba(20,33,61,.3);
  }
  .modal-box h3{
    margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--ink);
  }
  .modal-box p{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .text-dialog-input{
    width:100%;box-sizing:border-box;padding:9px 11px;margin:14px 0 18px;
    border:1px solid var(--border);border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--field-bg);
  }
  .text-dialog-input:focus{outline:none;border-color:var(--accent);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .tbtn-secondary, .tbtn-danger, .tbtn-primary{
    padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .tbtn-secondary{background:var(--paper);color:var(--ink);border-color:var(--border);}
  .tbtn-secondary:hover{background:var(--accent-soft);}
  .tbtn-danger{background:var(--warn);color:#fff;}
  .tbtn-danger:hover{background:#B02C1F;}
  .tbtn-primary{background:var(--hl);color:#fff;}
  .tbtn-primary:hover{background:var(--hl-dark);}
</style>

<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="https://platoedes-pty-ltd.github.io/DiscussionStudio/index.html" aria-label="Discussion Studio home"><svg class="brand-logo" width="26" height="26" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='#1F7A6C'/><path d='M8 8h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-5 4v-4H8a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z' fill='#FFFFFF'/><path d='M11.5 16.5L16 12l5 5' fill='none' stroke='#1F7A6C' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><circle cx='11.5' cy='16.5' r='2.1' fill='#1F7A6C'/><circle cx='16' cy='12' r='2.1' fill='#1F7A6C'/><circle cx='21' cy='17' r='2.1' fill='#1F7A6C'/></svg><span>Discussion Studio</span><span class="app-tagline">Visual Flow</span></a>

    <div class="toolgroup">
      <button class="tbtn" @click="addShape('rectangle')" title="Add rectangle" v-html='icons.rect + "<span class=tlabel>&nbsp;Rectangle</span>"'></button>
      <button class="tbtn" @click="addShape('circle')" title="Add circle" v-html='icons.circle + "<span class=tlabel>&nbsp;Circle</span>"'></button>
      <button class="tbtn" @click="addShape('diamond')" title="Add diamond" v-html='icons.diamond + "<span class=tlabel>&nbsp;Diamond</span>"'></button>
    </div>

    <div class="divider"></div>

    <div class="toolgroup">
      <div class="connect-wrap">
        <button class="tbtn" :class="{active: mode==='connect' || connectMenuOpen}" @click="onConnectButton"
                :title="mode==='connect' ? 'Stop connecting' : 'Choose a connection type'"
                aria-haspopup="menu" :aria-expanded="connectMenuOpen ? 'true' : 'false'"><span style="display:flex" v-html="icons.connect"></span><span class="tlabel">Connect</span><span class="caret" aria-hidden="true">▾</span></button>
        <div v-if="connectMenuOpen" class="menu-backdrop" @pointerdown="connectMenuOpen = false"></div>
        <div v-if="connectMenuOpen" class="connect-menu" role="menu">
          <button v-for="k in connKinds" :key="k.id" role="menuitem" :class="{current: connKind===k.id}" @click="startConnect(k.id)">
            <span v-html="icons[k.icon]"></span>
            <span class="kind-text"><span class="kind-name">{{ k.name }}</span><span class="kind-desc">{{ k.desc }}</span></span>
          </button>
        </div>
      </div>
      <span class="hint-chip" v-if="mode==='connect' && !connectFrom">{{ isTouch ? 'Tap' : 'Click' }} a shape to start {{ connKindHint }}</span>
      <span class="hint-chip" v-if="mode==='connect' && connectFrom">Now {{ isTouch ? 'tap' : 'click' }} the target shape</span>
    </div>

    <div class="divider"></div>

    <div class="toolgroup">
      <button class="tbtn icon-only" :class="{active: mode==='line'}" @click="toggleTool('line')" title="Line — drag to draw a straight line (hold Shift for 45° angles)" v-html='icons.line'></button>
      <button class="tbtn icon-only" :class="{active: mode==='draw'}" @click="toggleTool('draw')" title="Draw — drag to draw freehand" v-html='icons.pencil'></button>
      <button class="tbtn icon-only" v-if="hasTouch" :class="{active: multiMode}" @click="toggleMultiMode"
              :aria-pressed="multiMode ? 'true' : 'false'"
              title="Select many — tap items to add or remove them, drag on empty canvas to draw a box" v-html="icons.selectMany"></button>
    </div>

    <div class="divider"></div>

    <button class="tbtn" @click="autoArrange" title="Auto-arrange: lay shapes out by dependency" v-html='icons.arrange + "<span class=tlabel>&nbsp;Auto-arrange</span>"'></button>

    <div class="divider"></div>

    <div class="edge-style-toggle" title="Connection style">
      <button :class="{active: edgeStyle==='elbow'}" @click="edgeStyle='elbow'" v-html="icons.elbow"></button>
      <button :class="{active: edgeStyle==='point'}" @click="edgeStyle='point'" v-html="icons.direct"></button>
    </div>

    <div class="spacer"></div>

    <div class="toolgroup">
      <button class="tbtn icon-only" v-if="hasObjects" @click="panelVisible = !panelVisible"
              :class="{active: !panelVisible}" :title="panelVisible ? 'Hide panel' : 'Show panel'" v-html="icons.panel"></button>
      <button class="tbtn icon-only" @click="toggleTheme" :aria-pressed="theme==='dark' ? 'true' : 'false'"
              :title="theme==='dark' ? 'Switch to light mode' : 'Switch to dark mode'" v-html="theme==='dark' ? icons.sun : icons.moon"></button>
      <button class="tbtn icon-only" @click="showApiDoc = !showApiDoc" :class="{active: showApiDoc}" title="Developer API" v-html="icons.code"></button>
      <button class="tbtn icon-only" @click="openExportDialog('json')" title="Export diagram as JSON" v-html="icons.download"></button>
      <button class="tbtn icon-only" @click="openExportDialog('pptx')" title="Export as PowerPoint (.pptx)" v-html="icons.pptx"></button>
      <button class="tbtn icon-only" @click="openExportDialog('png')" title="Export canvas as PNG image (.png)" v-html="icons.png"></button>
      <button class="tbtn icon-only" @click="triggerImport" title="Import diagram JSON (you can choose several files)" v-html="icons.upload"></button>
      <input ref="fileInput" type="file" accept="application/json" multiple @change="importJSON" style="display:none" />
      <button class="tbtn icon-only danger" @click="confirmClearAll" title="Reset all data" v-html="icons.trash"></button>
    </div>
  </header>

  <div class="tabbar" role="tablist">
    <div v-for="d in docs" :key="d.id" class="tab" :class="{active: d.id === activeDocId}" role="tab"
         :aria-selected="d.id === activeDocId" :title="d.name" @click="switchDoc(d.id)">
      <span class="tab-name">{{ d.name }}</span>
      <span v-if="docDirty(d)" class="tab-dirty" title="Changed since it was opened or last exported"></span>
      <button class="tab-close" @click.stop="requestCloseDoc(d.id)" title="Close file">×</button>
    </div>
    <button class="tab-new" @click="newDoc" title="New blank file">+</button>
  </div>

  <div class="workspace">
    <main class="canvas-wrap">
      <svg class="board" ref="svgEl" :class="{'mode-connect': mode==='connect', 'mode-draw': mode==='line' || mode==='draw'}"
           @pointerdown.capture="onSvgMouseDownCapture" @pointerdown="onSvgMouseDown" @pointermove="onMouseMove" @pointerup="onMouseUp" @pointercancel="onMouseUp" @pointerleave="onMouseUp"
           @click="onCanvasClick" @wheel="onWheel">
        <defs>
          <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="var(--grid-dot)" />
          </pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--conn)" />
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)" />
          </marker>
          <!-- crow's foot: apex on the line, toes on the shape's edge; reversed automatically at the start -->
          <marker id="crow" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
            <path d="M 0 7 L 14 0 M 0 7 L 14 14" fill="none" stroke="var(--conn)" stroke-width="2" stroke-linecap="round" />
          </marker>
          <marker id="crow-selected" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
            <path d="M 0 7 L 14 0 M 0 7 L 14 14" fill="none" stroke="var(--hl)" stroke-width="2.5" stroke-linecap="round" />
          </marker>
          <!-- elbow mode: same foot set 9px back so the round port button on the shape's side doesn't hide it -->
          <marker id="crow-port" viewBox="0 0 23 14" refX="23" refY="7" markerWidth="23" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
            <path d="M 0 7 L 14 0 M 0 7 L 14 14" fill="none" stroke="var(--conn)" stroke-width="2" stroke-linecap="round" />
          </marker>
          <marker id="crow-port-selected" viewBox="0 0 23 14" refX="23" refY="7" markerWidth="23" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
            <path d="M 0 7 L 14 0 M 0 7 L 14 14" fill="none" stroke="var(--hl)" stroke-width="2.5" stroke-linecap="round" />
          </marker>
        </defs>

        <g :transform="viewportTransform">
          <rect class="canvas-bg" x="-4000" y="-4000" width="9000" height="9000" fill="url(#dotgrid)" />

          <g v-for="conn in connections" :key="conn.id" class="conn-group" :class="{selected: conn.id===selectedConnId, multi: isMulti('c', conn.id)}"
             @pointerdown.stop="onConnMouseDown(conn, $event)" @click.stop @dblclick.stop="openTextDialog(conn)">
            <path class="conn-hit" :d="connPath(conn)" />
            <path class="conn-path" :d="connPath(conn)" :marker-start="connMarkerStart(conn)" :marker-end="connMarkerEnd(conn)" />

            <text v-if="conn.label" class="conn-label" :x="connMid(conn).x" :y="connMid(conn).y - 8">{{ conn.label }}</text>

            <g v-if="conn.id===selectedConnId && !conn.label" class="add-label-hint"
               @pointerdown.stop @click.stop="openTextDialog(conn)">
              <circle :cx="connMid(conn).x" :cy="connMid(conn).y" r="10" />
              <text :x="connMid(conn).x" :y="connMid(conn).y + 4">+</text>
            </g>

            <g class="note-icon" :class="{'has-note': conn.note && conn.note.trim(), active: conn.noteOpen}"
               :transform="'translate(' + connMid(conn).x + ' ' + (connMid(conn).y + 17) + ')'"
               @pointerdown.stop @click.stop="toggleNote(conn)">
              <circle class="touch-hit" r="18" /><circle r="8.5" />
              <line x1="-4" y1="-2.2" x2="4" y2="-2.2" />
              <line x1="-4" y1="0" x2="4" y2="0" />
              <line x1="-4" y1="2.2" x2="1.5" y2="2.2" />
            </g>
          </g>

          <line v-if="mode==='connect' && connectFromShape" class="ghost-line"
                :x1="edgeStyle==='point' ? boundaryPoint(connectFromShape, mousePos.x, mousePos.y).x : portPoint(connectFromShape, connectFromPort || 'end').x"
                :y1="edgeStyle==='point' ? boundaryPoint(connectFromShape, mousePos.x, mousePos.y).y : portPoint(connectFromShape, connectFromPort || 'end').y"
                :x2="mousePos.x" :y2="mousePos.y" />

          <g v-for="shape in shapes" :key="shape.id" class="shape-group"
             :class="{selected: shape.id===selectedShapeId, multi: isMulti('s', shape.id), 'connect-source': shape.id===connectFrom}"
             :transform="'translate(' + shape.x + ' ' + shape.y + ')'"
             @pointerdown="onShapeMouseDown(shape, $event)" @click.stop @dblclick.stop="openTextDialog(shape)">
            <rect v-if="shape.type==='rectangle'" :width="shape.w" :height="shape.h" rx="10" ry="10"
                  :fill="shape.fill" :stroke="shape.id===selectedShapeId ? '#1D6CE0' : shape.stroke"
                  :stroke-width="shape.id===selectedShapeId ? 2.5 : 1.6" />
            <ellipse v-else-if="shape.type==='circle'" :cx="shape.w/2" :cy="shape.h/2" :rx="shape.w/2" :ry="shape.h/2"
                  :fill="shape.fill" :stroke="shape.id===selectedShapeId ? '#1D6CE0' : shape.stroke"
                  :stroke-width="shape.id===selectedShapeId ? 2.5 : 1.6" />
            <polygon v-else-if="shape.type==='diamond'" :points="diamondPoints(shape)"
                  :fill="shape.fill" :stroke="shape.id===selectedShapeId ? '#1D6CE0' : shape.stroke"
                  :stroke-width="shape.id===selectedShapeId ? 2.5 : 1.6" stroke-linejoin="round" />
            <foreignObject :width="shape.w" :height="shape.h">
              <div class="shape-label" xmlns="http://www.w3.org/1999/xhtml">{{ shape.label }}</div>
            </foreignObject>

            <template v-if="shape.id===selectedShapeId && mode==='select'">
              <rect v-for="hd in resizeHandles" :key="hd.k" class="resize-handle"
                    :x="shape.w * hd.fx - 5" :y="shape.h * hd.fy - 5" width="10" height="10" rx="2"
                    :style="{cursor: hd.cursor}"
                    @pointerdown.stop="onResizeHandleDown(shape, hd, $event)" @click.stop @dblclick.stop />
            </template>

            <g class="note-icon" :class="{'has-note': shape.note && shape.note.trim(), active: shape.noteOpen}"
               :transform="'translate(' + shape.w + ' 0)'"
               @pointerdown.stop @click.stop="toggleNote(shape)">
              <circle class="touch-hit" r="18" /><circle r="8.5" />
              <line x1="-4" y1="-2.2" x2="4" y2="-2.2" />
              <line x1="-4" y1="0" x2="4" y2="0" />
              <line x1="-4" y1="2.2" x2="1.5" y2="2.2" />
            </g>

            <g class="connect-icon port-start" title="Start (left)"
               :class="{active: shape.id===connectFrom && connectFromPort==='start'}"
               :transform="'translate(0 ' + (shape.h/2) + ')'"
               @pointerdown.stop @click.stop="onPortClick(shape, 'start')">
              <circle class="touch-hit" r="18" /><circle r="8.5" />
              <line x1="4" y1="0" x2="-3.5" y2="0" />
              <polyline points="-0.5,-3 -3.5,0 -0.5,3" />
            </g>

            <g class="connect-icon port-end" title="End (right)"
               :class="{active: shape.id===connectFrom && connectFromPort==='end'}"
               :transform="'translate(' + shape.w + ' ' + (shape.h/2) + ')'"
               @pointerdown.stop @click.stop="onPortClick(shape, 'end')">
              <circle class="touch-hit" r="18" /><circle r="8.5" />
              <line x1="-4" y1="0" x2="3.5" y2="0" />
              <polyline points="0.5,-3 3.5,0 0.5,3" />
            </g>
          </g>

          <!-- free lines and freehand drawings -->
          <g v-for="l in lines" :key="l.id" class="line-group" :class="{selected: l.id===selectedLineId, multi: isMulti('l', l.id)}">
            <path v-if="l.id===selectedLineId || isMulti('l', l.id)" class="line-halo" :d="linePath(l)" :stroke-width="l.width + 8" />
            <path class="line-hit" :d="linePath(l)" @pointerdown.stop="onLineMouseDown(l, $event)" @click.stop />
            <path class="line-path" :d="linePath(l)" :stroke="lineInk(l.stroke)" :stroke-width="l.width" />
            <polygon v-if="arrowHead(l)" :points="arrowHead(l)" :fill="lineInk(l.stroke)" stroke-linejoin="round" :stroke="lineInk(l.stroke)" stroke-width="1" pointer-events="none" />
            <g v-if="l.id===selectedLineId || (l.note && l.note.trim()) || l.noteOpen" class="note-icon"
               :class="{'has-note': l.note && l.note.trim(), active: l.noteOpen}"
               :transform="'translate(' + noteAnchor(l).x + ' ' + noteAnchor(l).y + ')'"
               @pointerdown.stop @click.stop="toggleNote(l)">
              <circle class="touch-hit" r="18" /><circle r="8.5" />
              <line x1="-4" y1="-2.2" x2="4" y2="-2.2" />
              <line x1="-4" y1="0" x2="4" y2="0" />
              <line x1="-4" y1="2.2" x2="1.5" y2="2.2" />
            </g>
            <template v-if="l.id===selectedLineId && l.kind==='line'">
              <circle v-for="(pt, i) in l.points" :key="i" class="line-handle" :cx="pt.x" :cy="pt.y" r="6"
                      @pointerdown.stop="onLineHandleDown(l, i, $event)" @click.stop />
            </template>
          </g>
          <g v-if="drawingLine">
            <path class="line-path" :d="linePath(drawingLine)" :stroke="lineInk(lineStyle.stroke)" :stroke-width="lineStyle.width" />
            <polygon v-if="arrowHead(drawingLine)" :points="arrowHead(drawingLine)" :fill="lineInk(lineStyle.stroke)" :stroke="lineInk(lineStyle.stroke)" stroke-width="1" stroke-linejoin="round" />
          </g>

          <!-- persistent note cards: one per shape/connection with noteOpen, tethered by a dotted line -->
          <g v-for="shape in shapes.filter(s => s.noteOpen)" :key="'note-shape-' + shape.id">
            <line class="note-tether" :x1="noteAnchor(shape).x" :y1="noteAnchor(shape).y"
                  :x2="notePos(shape).x" :y2="notePos(shape).y + NOTE_H/2" />
            <foreignObject class="note-popup" :x="notePos(shape).x" :y="notePos(shape).y" :width="NOTE_W" :height="NOTE_H">
              <div class="note-box" xmlns="http://www.w3.org/1999/xhtml" @click.stop>
                <div class="note-box-header" @pointerdown.stop="onNoteBoxMouseDown(shape, $event)">
                  <span>Note — {{ shape.label }}</span>
                  <button type="button" @pointerdown.stop @click.stop="toggleNote(shape)">×</button>
                </div>
                <textarea v-model="shape.note" placeholder="Add a note…"
                          @pointerdown.stop @keydown="onNoteKeydown" @vue:mounted="onNoteTextareaMounted"></textarea>
              </div>
            </foreignObject>
          </g>

          <g v-for="conn in connections.filter(c => c.noteOpen)" :key="'note-conn-' + conn.id">
            <line class="note-tether" :x1="noteAnchor(conn).x" :y1="noteAnchor(conn).y"
                  :x2="notePos(conn).x" :y2="notePos(conn).y + NOTE_H/2" />
            <foreignObject class="note-popup" :x="notePos(conn).x" :y="notePos(conn).y" :width="NOTE_W" :height="NOTE_H">
              <div class="note-box" xmlns="http://www.w3.org/1999/xhtml" @click.stop>
                <div class="note-box-header" @pointerdown.stop="onNoteBoxMouseDown(conn, $event)">
                  <span>Note — connection</span>
                  <button type="button" @pointerdown.stop @click.stop="toggleNote(conn)">×</button>
                </div>
                <textarea v-model="conn.note" placeholder="Add a note…"
                          @pointerdown.stop @keydown="onNoteKeydown" @vue:mounted="onNoteTextareaMounted"></textarea>
              </div>
            </foreignObject>
          </g>

          <g v-for="l in lines.filter(x => x.noteOpen)" :key="'note-line-' + l.id">
            <line class="note-tether" :x1="noteAnchor(l).x" :y1="noteAnchor(l).y"
                  :x2="notePos(l).x" :y2="notePos(l).y + NOTE_H/2" />
            <foreignObject class="note-popup" :x="notePos(l).x" :y="notePos(l).y" :width="NOTE_W" :height="NOTE_H">
              <div class="note-box" xmlns="http://www.w3.org/1999/xhtml" @click.stop>
                <div class="note-box-header" @pointerdown.stop="onNoteBoxMouseDown(l, $event)">
                  <span>Note — {{ l.kind === 'free' ? 'drawing' : 'line' }}</span>
                  <button type="button" @pointerdown.stop @click.stop="toggleNote(l)">×</button>
                </div>
                <textarea v-model="l.note" placeholder="Add a note…"
                          @pointerdown.stop @keydown="onNoteKeydown" @vue:mounted="onNoteTextareaMounted"></textarea>
              </div>
            </foreignObject>
          </g>
          <rect v-if="marquee.active" class="marquee" :x="Math.min(marquee.x0, marquee.x1)" :y="Math.min(marquee.y0, marquee.y1)"
                :width="Math.abs(marquee.x1 - marquee.x0)" :height="Math.abs(marquee.y1 - marquee.y0)" />
        </g>
      </svg>

      <div class="zoom-hud">
        <button @click="zoomBy(0.85)" title="Zoom out">–</button>
        <span class="zoom-pct">{{ Math.round(viewport.scale*100) }}%</span>
        <button @click="zoomBy(1/0.85)" title="Zoom in">+</button>
        <button @click="resetView" title="Reset view" style="font-size:11px;">Reset</button>
      </div>

      <div class="canvas-hint connect-hint" v-if="mode==='connect'">{{ connectFrom ? 'Now ' + (isTouch ? 'tap' : 'click') + ' the target shape' : (isTouch ? 'Tap' : 'Click') + ' a shape to start ' + connKindHint }} · {{ isTouch ? 'tap' : 'click' }} Connect again to cancel</div>
      <div class="canvas-hint multi-hint" v-else-if="multiMode && mode==='select'">Select many: tap items to add or remove them · drag on empty canvas to draw a box · tap the button again to finish</div>
      <div class="canvas-hint" v-else-if="mode==='line'">Drag to draw a line · hold Shift for 45° angles · press Escape or click Line again to finish</div>
      <div class="canvas-hint" v-else-if="mode==='draw'">Drag to draw freehand · press Escape or click Draw again to finish</div>
      <div class="canvas-hint" v-else-if="isTouch">Double-tap a shape or connector to edit its label · tap a port to connect · tap empty canvas to add a rectangle · pinch to zoom</div>
      <div class="canvas-hint" v-else>Double-click a shape or connector to edit its label · click a port to connect · click empty canvas to add a rectangle</div>
    </main>

    <aside class="panel" v-if="panelVisible && !showApiDoc">
      <template v-if="multiCount > 0">
        <h3>{{ multiCount }} selected</h3>
        <div class="meta-row">{{ multi.shapes.length }} shapes · {{ multi.conns.length }} connections · {{ multi.lines.length }} lines</div>
        <p class="empty-panel" v-if="multiMode">Tap an item to add it or remove it. Drag on empty canvas to select with a box. Tap the Select many button again to finish.</p>
        <p class="empty-panel" v-else>Shift-click an item to add it or remove it. Shift-drag on empty canvas to select with a box. Press Escape to clear the selection.</p>
        <button class="delete-btn" @click="deleteMulti()">Delete {{ multiCount }} selected</button>
      </template>

      <template v-else-if="selectedShape">
        <h3>Shape</h3>
        <div class="field">
          <label>Label</label>
          <input type="text" v-model="selectedShape.label" />
        </div>
        <div class="field">
          <label>Fill color</label>
          <div class="swatches">
            <div v-for="c in palette" :key="c" class="swatch" :class="{selected: selectedShape.fill===c}"
                 :style="{background:c}" @click="selectedShape.fill = c"></div>
          </div>
        </div>
        <div class="field">
          <label>Note</label>
          <textarea class="panel-note" v-model="selectedShape.note" placeholder="Add a note…"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label>Width</label>
            <input type="number" min="40" step="1" :value="Math.round(selectedShape.w)" @change="setShapeSize(selectedShape, 'w', $event.target.value)" />
          </div>
          <div class="field">
            <label>Height</label>
            <input type="number" min="30" step="1" :value="Math.round(selectedShape.h)" @change="setShapeSize(selectedShape, 'h', $event.target.value)" />
          </div>
        </div>
        <div class="meta-row">id: {{ selectedShape.id }}</div>
        <button class="delete-btn" @click="removeShape(selectedShape.id)">Delete shape</button>
      </template>

      <template v-else-if="selectedConn">
        <h3>Connection</h3>
        <div class="field">
          <label>Label</label>
          <input type="text" v-model="selectedConn.label" placeholder="Optional label" />
        </div>
        <div class="field">
          <label>Type</label>
          <div class="port-toggle kind-toggle">
            <button v-for="k in connKinds" :key="k.id" :class="{active: connKindOf(selectedConn)===k.id}"
                    :title="k.desc" @click="selectedConn.kind = k.id"><span v-html="icons[k.icon]"></span>{{ k.short }}</button>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>From port</label>
            <div class="port-toggle">
              <button :class="{active: selectedConn.fromPort==='end'}" @click="selectedConn.fromPort='end'">End</button>
              <button :class="{active: selectedConn.fromPort==='start'}" @click="selectedConn.fromPort='start'">Start</button>
            </div>
          </div>
          <div class="field">
            <label>To port</label>

const app = createApp({
  template: TEMPLATE,
  setup() {
    const shapes = reactive([]);
    const connections = reactive([]);
    const lines = reactive([]);   // free lines and freehand drawings
    let nextShapeId = 1;
    let nextConnId = 1;
    let nextLineId = 1;

    const mode = ref('select');
    const edgeStyle = ref('elbow'); // 'elbow' | 'point' — global rendering mode for all connections
    const connectFrom = ref(null);
    const connectFromPort = ref(null);
    // connection types: an arrow at the target (default), a crow's foot at the target
    // (one-to-many), or crow's feet at both ends (many-to-many). Stored as conn.kind;
    // a connection without a kind (older files) is an arrow.
    const CONN_KINDS = [
      { id: 'arrow', name: 'Arrow', short: 'Arrow', icon: 'kindArrow', desc: 'Default. Arrow at the target end', hint: 'a link' },
      { id: 'one-many', name: 'One to many', short: '1 : N', icon: 'kindOneMany', desc: "Crow's foot at the target end", hint: 'a one-to-many link' },
      { id: 'many-many', name: 'Many to many', short: 'N : N', icon: 'kindManyMany', desc: "Crow's feet at both ends", hint: 'a many-to-many link' },
    ];
    const connKinds = CONN_KINDS;
    const connKind = ref('arrow');       // type used for the next connection
    const connectMenuOpen = ref(false);
    const connKindHint = computed(() => (CONN_KINDS.find(k => k.id === connKind.value) || CONN_KINDS[0]).hint);
    function connKindOf(c) { return c && (c.kind === 'one-many' || c.kind === 'many-many') ? c.kind : 'arrow'; }
    function crowMarker(c) {
      return 'url(#crow' + (edgeStyle.value === 'elbow' ? '-port' : '') + (c.id === selectedConnId.value ? '-selected' : '') + ')';
    }
    function connMarkerEnd(c) {
      if (connKindOf(c) !== 'arrow') return crowMarker(c);
      return c.id === selectedConnId.value ? 'url(#arrow-selected)' : 'url(#arrow)';
    }
    function connMarkerStart(c) { return connKindOf(c) === 'many-many' ? crowMarker(c) : null; }
    // The two toe lines of a crow's foot whose toes touch `tip`, coming from the direction of `from`.
    const CROW_LEN = 14, CROW_SPREAD = 7;
    function crowFootSegments(tip, from, len, spread) {
      len = len || CROW_LEN; spread = spread || CROW_SPREAD;
      const d = Math.hypot(tip.x - from.x, tip.y - from.y);
      if (!d) return [];
      const ux = (tip.x - from.x) / d, uy = (tip.y - from.y) / d;
      const L = Math.min(len, d);
      const apex = { x: tip.x - ux * L, y: tip.y - uy * L };
      return [[apex, { x: tip.x - uy * spread, y: tip.y + ux * spread }],
              [apex, { x: tip.x + uy * spread, y: tip.y - ux * spread }]];
    }
    // first point along `pts` (starting at index i, stepping by `step`) that is not on top of pts[i]
    function distinctNeighbor(pts, i, step) {
      for (let j = i + step; j >= 0 && j < pts.length; j += step) {
        if (Math.hypot(pts[j].x - pts[i].x, pts[j].y - pts[i].y) > 0.5) return pts[j];
      }
      return pts[i + step] || pts[i];
    }
    // ---- theme (light / dark) ----
    // The <head> script sets data-theme before first paint. A choice made here is saved;
    // until then the app follows the system setting, also when it changes.
    const THEME_KEY = 'discussion-studio-theme';
    const theme = ref(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    function applyTheme(v) { theme.value = v; document.documentElement.setAttribute('data-theme', v); }
    function toggleTheme() {
      applyTheme(theme.value === 'dark' ? 'light' : 'dark');
      try { localStorage.setItem(THEME_KEY, theme.value); } catch (e) {}
    }
    const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function onSystemTheme(e) {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
      if (saved !== 'dark' && saved !== 'light') applyTheme(e.matches ? 'dark' : 'light');
    }
    // The default line colour (navy) would vanish on the dark canvas, so it is drawn light there.
    // Only the screen changes: files and exports keep the stored colour.
    function lineInk(c) { return theme.value === 'dark' && (c || '').toUpperCase() === '#14213D' ? '#E6ECF7' : c; }

    const selectedShapeId = ref(null);
    const selectedConnId = ref(null);
    const selectedLineId = ref(null);
    const lineStyle = reactive({ stroke: '#14213D', width: 3, arrow: false });  // style of the next line

    const selectedConn = computed(() => connections.find(c => c.id === selectedConnId.value) || null);
    const connectFromShape = computed(() => shapes.find(s => s.id === connectFrom.value) || null);

    function uid(prefix) {
      if (prefix === 'shape') return 'shape_' + (nextShapeId++);
      return 'conn_' + (nextConnId++);
    }

    function defaultLabel(type) {
      const names = { rectangle: 'Task', circle: 'Node', diamond: 'Decision' };
      const n = shapes.filter(s => s.type === type).length + 1;
      return (names[type] || 'Shape') + ' ' + n;
    }

    function addShape(type, opts) {
      opts = opts || {};
      const d = SHAPE_DEFAULTS[type] || SHAPE_DEFAULTS.rectangle;
      const id = uid('shape');
      const count = shapes.length;
      const baseX = opts.x !== undefined ? opts.x : (80 + (count % 6) * 40);
      const baseY = opts.y !== undefined ? opts.y : (80 + (count % 6) * 30);
      const label = opts.label !== undefined ? opts.label : defaultLabel(type);
      shapes.push({
        id, type,
        x: baseX, y: baseY,
        w: opts.w || d.w, h: opts.h || d.h,
        label,
        fill: opts.fill || '#FFFFFF',
        stroke: opts.stroke || '#14213D',
        note: opts.note || '',
        noteOpen: false, noteOffsetX: null, noteOffsetY: null,

      const idx = shapes.findIndex(s => s.id === id);

      for (let i = connections.length - 1; i >= 0; i--) {

      if (selectedShapeId.value === id) selectedShapeId.value = null;

    function addConnection(fromId, toId, label, note, fromPort, toPort, kind) {
      if (fromId === toId) return null;
      if (!shapes.some(s => s.id === fromId) || !shapes.some(s => s.id === toId)) return null;
      const fp = fromPort || 'end';
      const tp = toPort || 'start';
      if (connections.some(c => c.from === fromId && c.to === toId && c.fromPort === fp && c.toPort === tp)) return null;
      const id = uid('conn');
      connections.push({
        id, from: fromId, to: toId, label: label || '', note: note || '',
        noteOpen: false, noteOffsetX: null, noteOffsetY: null,
        fromPort: fp, toPort: tp,
        kind: (kind === 'one-many' || kind === 'many-many') ? kind : 'arrow',
      });
      selectConnection(id);
      return id;
    }

    function removeConnection(id) {
      const idx = connections.findIndex(c => c.id === id);
      if (idx !== -1) connections.splice(idx, 1);
      if (selectedConnId.value === id) selectedConnId.value = null;
    }

    // ---- multi-selection: Shift-click an item, or Shift-drag a box on empty canvas ----
    // The three ids lists hold the ids of the selected shapes, connections, and lines. When the
    // lists are not empty, the single selection values are all null.
    const multi = reactive({ shapes: [], conns: [], lines: [] });
    const marquee = reactive({ active: false, x0: 0, y0: 0, x1: 0, y1: 0 });
    const multiCount = computed(() => multi.shapes.length + multi.conns.length + multi.lines.length);
    const MULTI_KEYS = { s: 'shapes', c: 'conns', l: 'lines' };
    function isMulti(kind, id) { return multi[MULTI_KEYS[kind]].indexOf(id) !== -1; }
    function clearMulti() { multi.shapes.splice(0); multi.conns.splice(0); multi.lines.splice(0); }
    // Moves the single selection into the multi-selection, so Shift-click adds to it.
    function seedMulti() {
      if (multiCount.value > 0) return;
      if (selectedShapeId.value) multi.shapes.push(selectedShapeId.value);
      else if (selectedConnId.value) multi.conns.push(selectedConnId.value);
      else if (selectedLineId.value) multi.lines.push(selectedLineId.value);
      selectedShapeId.value = null; selectedConnId.value = null; selectedLineId.value = null;
      showApiDoc.value = false;
    }
    function toggleMulti(kind, id) {

      }
    }
    function deleteMulti() {

      sh.forEach(removeShape);
      ln.forEach(removeLine);

    function selectMany(sel) {

      (sel.connections || []).forEach(id => { if (connections.some(x => x.id === id)) multi.conns.push(id); });
      (sel.lines || []).forEach(id => { if (lines.some(x => x.id === id)) multi.lines.push(id); });

    }
    function finishMarquee() {

      const minX = Math.min(marquee.x0, marquee.x1), maxX = Math.max(marquee.x0, marquee.x1);
      const minY = Math.min(marquee.y0, marquee.y1), maxY = Math.max(marquee.y0, marquee.y1);
      if (maxX - minX < 3 && maxY - minY < 3) return;   // a click, not a box
      const inside = (x, y) => x >= minX && x <= maxX && y >= minY && y <= maxY;
      const add = (arr, id) => { if (arr.indexOf(id) === -1) arr.push(id); };

        if (sh.x <= maxX && sh.x + sh.w >= minX && sh.y <= maxY && sh.y + sh.h >= minY) add(multi.shapes, sh.id);
      });
      lines.forEach(l => {
        let hit = false;
        for (let i = 0; i < l.points.length && !hit; i++) {
          const a = l.points[i];
          if (inside(a.x, a.y)) { hit = true; break; }
          const b = l.points[i + 1];
          if (!b) break;
          const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 6));
          for (let k = 1; k < n; k++) { if (inside(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n)) { hit = true; break; } }
        }
        if (hit) add(multi.lines, l.id);
      });
      connections.forEach(c => {
        const m = connMid(c);
        if (inside(m.x, m.y) || (multi.shapes.indexOf(c.from) !== -1 && multi.shapes.indexOf(c.to) !== -1)) add(multi.conns, c.id);
      });
    }

    function selectShape(id) { clearMulti(); selectedShapeId.value = id; selectedConnId.value = null; selectedLineId.value = null; showApiDoc.value = false; }
    function selectConnection(id) { clearMulti(); selectedConnId.value = id; selectedShapeId.value = null; selectedLineId.value = null; showApiDoc.value = false; }
    function selectLine(id) { clearMulti(); selectedLineId.value = id; selectedShapeId.value = null; selectedConnId.value = null; showApiDoc.value = false; }
    function onConnMouseDown(conn, evt) {
      if (isAddKey(evt) && mode.value === 'select') { toggleMulti('c', conn.id); return; }

      if (isDoubleTap('c' + conn.id, evt)) openTextDialog(conn);
    }

    // Double tap on a finger or pen = double-click. Some touch browsers never send dblclick.
    const lastTap = { key: null, t: 0, x: 0, y: 0 };
    function isDoubleTap(key, evt) {
      if (!evt || !evt.pointerType || evt.pointerType === 'mouse') return false;

      const hit = lastTap.key === key && now - lastTap.t < 400 &&
